<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Slayer Music Player</title>

    <link rel="icon" type="image/png" href="your-icon-name.png" />
    <link rel="apple-touch-icon" href="your-icon-name.png" />
    <link rel="manifest" href="manifest.json" />

    <link rel="stylesheet" href="style.css" />

    <meta name="theme-color" content="#b38b59" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
  </head>
  <body>
    <div class="fire-world">
      <div class="magma-glow"></div>
      <div class="spark-container">
        <div class="spark"></div>
        <div class="spark"></div>
        <div class="spark"></div>
        <div class="spark"></div>
        <div class="spark"></div>
        <div class="spark"></div>
      </div>

      <main class="player-card">
        <div class="tanjiro-header"></div>

        <div class="player-body">
          <div class="art-zone">
            <div class="glow-ring"></div>
            <div class="album-art" id="art">⚔️</div>
          </div>

          <div class="song-meta">
            <h2 id="songTitle">Set Your Heart Ablaze</h2>
            <p id="artistName">Breathing Style: Music</p>
          </div>

          <input type="range" id="progress" value="0" class="seeker" />

          <div class="controls">
            <button onclick="prevSong()">⏮</button>
            <button id="playBtn" class="play-main" onclick="togglePlay()">
              ▶
            </button>
            <button onclick="nextSong()">⏭</button>
          </div>

          <div class="app-actions">
            <label for="fileInput" class="btn-upload">🍱 ADD COLLECTION</label>
            <input type="file" id="fileInput" accept="audio/*" multiple />
          </div>

          <div class="playlist-box">
            <ul id="playlistList"></ul>
          </div>
        </div>
      </main>
    </div>

    <audio id="audioSource"></audio>
    <script src="script.js"></script>
  </body>
</html>
